<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYC Desk: Lo-fi board</title><link rel="stylesheet" href="../lofi.css">
<style>
.wf-board{flex-direction:column;align-items:flex-start;padding:64px;gap:56px}
.wf-wrap{display:flex;gap:32px;align-items:flex-start}
.wf-desk{width:1440px;height:900px;background:#fff;border:2px solid var(--wf-ink);border-radius:14px;overflow:hidden;display:flex;position:relative;flex:none}
.wf-desk *{box-sizing:border-box}
.wf-side{width:240px;border-right:1.5px solid var(--wf-line);padding:24px 16px;display:flex;flex-direction:column;gap:6px;flex:none}
.wf-side .nav{height:40px;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:15px;color:#5b5e68}
.wf-side .nav.on{background:var(--wf-fill);color:var(--wf-ink);font-weight:700}
.wf-main{flex:1;display:flex;flex-direction:column;min-width:0}
.wf-top{height:56px;border-bottom:1.5px solid var(--wf-soft);display:flex;align-items:center;padding:0 32px;gap:16px;flex:none}
.wf-page{padding:28px 32px;display:flex;flex-direction:column;gap:20px;flex:1;min-height:0}
.wf-cols{display:flex;gap:24px;align-items:flex-start}
.wf-tbl{border:1.5px solid var(--wf-line);border-radius:10px;overflow:hidden}
.wf-tr{display:grid;gap:16px;align-items:center;padding:0 16px;height:52px;border-top:1.5px solid var(--wf-soft)}
.wf-tr.h{height:40px;background:var(--wf-fill);border-top:0;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#5b5e68}
.wf-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#5b5e68;font-weight:600}
.wf-pin{right:auto}
.wf-notes{width:340px;padding-top:0}
.wf-frame .wf-label{font-size:16px}
</style></head>
<body style="margin:0">
<div class="wf-board" data-figma-name="Lo-fi / KYC Onboarding Desk" id="board"></div>
<script>
var NAV=["Review queue","New customer","Screening","Reports","Audit log"];
function shell(active,title,body,right){
  return '<div class="wf-desk"><div class="wf-side"><div class="wf-row" style="margin-bottom:20px"><div class="wf-icon"></div><b>KYC Desk</b></div>'+
  NAV.map(function(n){return '<div class="nav'+(n===active?' on':'')+'"><span class="wf-icon" style="width:20px;height:20px"></span>'+n+'</div>'}).join('')+
  '<div class="wf-row" style="margin-top:auto"><div class="wf-circle" style="width:34px;height:34px"></div><div class="wf-grow wf-gap" style="gap:6px"><div class="wf-line dark m"></div><div class="wf-line s"></div></div></div></div>'+
  '<div class="wf-main"><div class="wf-top"><div class="wf-input" style="width:360px;height:36px">Search case id or customer</div><div class="wf-grow"></div><span class="wf-icon"></span></div>'+
  '<div class="wf-page">'+body+'</div></div>'+(right||'')+'</div>';
}
function pin(n,l,t){return '<div class="wf-pin" style="left:'+l+'px;top:'+t+'px">'+n+'</div>'}
function notes(list,states){
  return '<div class="wf-notes"><div class="wf-note-title">Notes</div>'+list.map(function(t,i){return '<div class="wf-note"><b>'+(i+1)+'</b><span>'+t+'</span></div>'}).join('')+
  '<div class="wf-note-title" style="margin-top:12px">States to design</div><div class="wf-note"><span>'+states+'</span></div></div>';
}
function frame(name,desk,n,s){return '<div class="wf-frame" data-figma-name="'+name+'"><div class="wf-label">'+name+'<span>Lo-fi</span></div><div class="wf-wrap">'+desk+notes(n,s)+'</div></div>'}
function lines(){return '<div class="wf-line dark m"></div>'}
function rowCells(cols,cells){return '<div class="wf-tr" style="grid-template-columns:'+cols+'">'+cells.map(function(c){return c.charAt(0)==='<'?c:'<span>'+c+'</span>'}).join('')+'</div>'}
function fld(l,w){return '<div class="wf-field" style="'+(w||'')+'">'+l+'<div class="wf-input" style="height:40px"></div></div>'}

var out=[];

/* 01 Sign in */
out.push(frame('01 / Sign in',
 '<div class="wf-desk"><div class="wf-grow" style="background:var(--wf-fill);display:flex;flex-direction:column;justify-content:flex-end;padding:56px;gap:12px"><div class="wf-icon" style="width:44px;height:44px"></div><div class="wf-title" style="font-size:40px;max-width:520px">Know every customer before you onboard them.</div><div class="wf-p">One rating, one approval path, one audit trail.</div></div>'+
 '<div style="width:560px;display:flex;flex-direction:column;justify-content:center;padding:0 80px;gap:20px"><div class="wf-title">Sign in</div><div class="wf-p">Use your bank account. Your role is set by the directory.</div><div class="wf-btn fill">Continue with bank SSO</div><div class="wf-p" style="font-size:12px">Access is logged. Unauthorised use is a policy breach.</div></div>'+pin(1,1000,330)+pin(2,1000,420)+'</div>',
 ['No username or password fields: SSO only (FR-1). The current POC shows test logins; those go away.','One primary action, nothing else competes with it.'],
 'SSO error ("We could not reach sign-in. Try again"), no role assigned, session expired.'));

/* 02 Queue */
var stat=function(l,n){return '<div class="wf-box wf-fill wf-grow"><div class="wf-p">'+l+'</div><div class="wf-title">'+n+'</div></div>'};
var qcols='120px 1.4fr 100px 150px 170px 110px 110px';
var qrows=[['KYC-10003','Elena Vasquez-Ruiz','High','Escalated','Compliance Officer'],['KYC-10002','Marcus Oyelaran','Medium','Pending review','Senior Analyst'],['KYC-10007','Tomasz Kowalczyk','Medium','Pending review','Senior Analyst'],['KYC-10005','Aiko Tanabe','Low','Approved','Automatic']].map(function(r){
 return rowCells(qcols,['<b>'+r[0]+'</b>','<span>'+r[1]+'</span>','<span class="wf-chip">'+r[2]+'</span>','<span class="wf-chip">'+r[3]+'</span>','<span class="wf-p">'+r[4]+'</span>','<span class="wf-p">04 Feb</span>','<span class="wf-btn" style="height:34px;font-size:14px">Review</span>'])}).join('');
out.push(frame('02 / Review queue',
 shell('Review queue','',
 '<div class="wf-row"><div class="wf-grow"><div class="wf-title">Review queue</div><div class="wf-p">3 cases need a decision from you</div></div><div class="wf-btn fill" style="width:180px">+ New customer</div></div>'+
 '<div class="wf-row">'+stat('Awaiting decision','7')+stat('High risk','2')+stat('Blocked by screening','1')+stat('Reviews due this month','4')+'</div>'+
 '<div class="wf-row"><div class="wf-seg" style="width:420px"><span class="on">Needs my decision</span><span>All open</span><span>Decided</span><span>Blocked</span></div><div class="wf-grow"></div><div class="wf-input" style="width:200px">Rating: any</div></div>'+
 '<div class="wf-tbl">'+rowCells(qcols,['Case','Customer','Rating','Status','Approver needed','Created',''])
 .replace('wf-tr','wf-tr h')+qrows+'</div>'+pin(1,1260,36)+pin(2,270,170)+pin(3,270,300)+pin(4,1320,430)),
 ['Primary action is New customer. Everything else is a read.','Four tiles answer "what needs me first" before the list does.','Segmented control defaults to cases this user can actually decide.','No quick approve in the table. Approving always happens on the case, with a note (FR-4, BR-8).'],
 'Loading skeleton, empty queue, error with retry, filter with no results, own cases shown locked.'));

/* 03 New customer */
out.push(frame('03 / New customer',
 shell('New customer','',
 '<div class="wf-row"><div class="wf-grow"><div class="wf-title">New customer</div><div class="wf-p">Checks run when you submit</div></div></div>'+
 '<div class="wf-cols"><div class="wf-grow wf-gap" style="gap:20px">'+
 '<div class="wf-box wf-gap"><div class="wf-h">Identity</div><div class="wf-row">'+fld('Full name','flex:2')+fld('Date of birth','flex:1')+'</div><div class="wf-row">'+fld('Nationality','flex:1')+fld('Country of residence','flex:1')+fld('Occupation','flex:1')+'</div></div>'+
 '<div class="wf-box wf-gap"><div class="wf-h">ID document</div><div class="wf-row">'+fld('ID type','flex:1')+fld('ID number','flex:1')+fld('Expiry','flex:1')+'</div><div class="wf-img" style="min-height:90px;display:grid;place-items:center;background-color:#fff"><span class="wf-chip" style="background:#fff">Drop ID copy or browse</span></div></div>'+
 '<div class="wf-box wf-gap"><div class="wf-h">Relationship</div><div class="wf-row">'+fld('Source of funds','flex:1')+fld('Expected monthly volume','flex:1')+fld('Met face to face','flex:1')+'</div></div></div>'+
 '<div class="wf-box" style="width:400px;flex:none"><div class="wf-h">Risk preview</div><div class="wf-title" style="margin:8px 0">0 &middot; Low</div><div class="wf-line dark" style="height:10px"></div><div class="wf-gap" style="margin-top:16px"><div class="wf-row"><span class="wf-grow wf-p">High-risk nationality</span><span>+0</span></div><div class="wf-row"><span class="wf-grow wf-p">Monthly volume</span><span>+0</span></div><div class="wf-row"><span class="wf-grow wf-p">Source of funds</span><span>+0</span></div></div></div></div>'+
 '<div class="wf-row" style="margin-top:auto;justify-content:flex-end"><div class="wf-btn" style="width:120px">Cancel</div><div class="wf-btn fill" style="width:240px">Run checks and create case</div></div>'+pin(1,250,150)+pin(2,1000,330)+pin(3,1300,740)),
 ['Three groups instead of one 12-field grid. ID upload sits with the ID fields (FR-7).','Live preview shows the BR-4 factors adding up. Design proposal, not a requirement.','One submit. Errors appear on the field, summary at the top (under 18, ID expired).'],
 'Field errors, uploading, submitting, sanctions match (blocked), saved confirmation.'));

/* 04 Case detail */
out.push(frame('04 / Case detail',
 shell('Review queue','',
 '<div class="wf-p">&lsaquo; Review queue / KYC-10003</div>'+
 '<div class="wf-row"><div class="wf-circle" style="width:56px;height:56px"></div><div class="wf-grow"><div class="wf-title">Elena Vasquez-Ruiz</div><div class="wf-p">KYC-10003 &middot; Created by senior1 &middot; PEP</div></div><span class="wf-chip">High risk</span><span class="wf-chip">Escalated</span></div>'+
 '<div class="wf-cols"><div class="wf-grow wf-gap" style="gap:20px">'+
 '<div class="wf-box wf-gap"><div class="wf-row"><span class="wf-h wf-grow">Risk score</span><span class="wf-title">8</span></div><div class="wf-line dark" style="height:12px"></div><div class="wf-row"><span class="wf-p">Low 0-2</span><span class="wf-grow"></span><span class="wf-p">Medium 3-5</span><span class="wf-grow"></span><span class="wf-p">High 6+</span></div><div class="wf-gap" style="gap:8px"><div class="wf-row"><span class="wf-grow">Politically exposed</span><span>+3</span></div><div class="wf-row"><span class="wf-grow">High-risk nationality</span><span>+3</span></div><div class="wf-row"><span class="wf-grow">Source of funds: other</span><span>+2</span></div></div></div>'+
 '<div class="wf-box wf-gap"><div class="wf-h">Customer</div><div class="wf-row"><div class="wf-grow wf-gap" style="gap:8px"><div class="wf-line dark m"></div><div class="wf-line s"></div></div><div class="wf-grow wf-gap" style="gap:8px"><div class="wf-line dark m"></div><div class="wf-line s"></div></div><div class="wf-grow wf-gap" style="gap:8px"><div class="wf-line dark m"></div><div class="wf-line s"></div></div></div></div>'+
 '<div class="wf-box wf-gap"><div class="wf-h">History</div><div class="wf-line m"></div><div class="wf-line s"></div></div></div>'+
 '<div class="wf-gap" style="width:400px;flex:none;gap:16px"><div class="wf-box wf-gap"><div class="wf-h">Screening</div><div class="wf-row"><span class="wf-grow">Sanctions</span><span class="wf-chip">Clear</span></div><div class="wf-row"><span class="wf-grow">PEP</span><span class="wf-chip">Match</span></div></div>'+
 '<div class="wf-box wf-gap"><div class="wf-h">Decision</div><div class="wf-p">Needs: Compliance Officer after enhanced due diligence</div><div class="wf-input" style="height:96px;align-items:flex-start;padding-top:10px">Decision note (required)</div><div class="wf-btn fill">Approve</div><div class="wf-row"><div class="wf-btn wf-grow">Escalate</div><div class="wf-btn wf-grow">Reject</div></div></div></div></div>'+pin(1,310,160)+pin(2,320,250)+pin(3,1290,520)+pin(4,1290,330)),
 ['Header carries identity, rating, status. Nothing about the case is more than one glance away.','Score shown with the three bands and every contributing factor. One definition, no second calculation (BR-5).','Decision lives in the right rail, always visible. Note is mandatory, Approve explains why it is disabled (BR-6, BR-8).','Screening results sit beside the decision because they inform it.'],
 'Approve disabled (creator, wrong role), note missing, decided read-only, blocked by sanctions, ID masked vs. revealed.'));

/* 05 Screening */
out.push(frame('05 / Name screening',
 shell('Screening','',
 '<div class="wf-title">Name screening</div><div class="wf-p">Check any name against sanctions and PEP lists. Every search is logged.</div>'+
 '<div class="wf-row"><div class="wf-input wf-grow" style="height:48px">Full name</div><div class="wf-input" style="width:200px;height:48px">Date of birth (optional)</div><div class="wf-btn fill" style="width:140px">Screen</div></div>'+
 '<div class="wf-row"><div class="wf-p">List updated today 06:00 &middot; Approved provider</div></div>'+
 '<div class="wf-tbl">'+rowCells('1.4fr 140px 120px 1fr',['Match name','List','Strength','Details']).replace('wf-tr','wf-tr h')+rowCells('1.4fr 140px 120px 1fr',['<b>Elena Vasquez Ruiz</b>','<span class="wf-chip">PEP</span>','<span>92%</span>','<span class="wf-line m"></span>'])+rowCells('1.4fr 140px 120px 1fr',['<b>E. Vasquez</b>','<span class="wf-chip">PEP</span>','<span>61%</span>','<span class="wf-line m"></span>'])+'</div>'+pin(1,1180,120)+pin(2,160,225)),
 ['Result summary first, evidence below. A sanctions hit must be impossible to miss and says it is reported to Compliance (BR-2).','List freshness shown at all times (NFR-2).'],
 'Clear (no matches), PEP only, sanctions match, list older than 24 h, provider unavailable.'));

/* 06 Reports */
out.push(frame('06 / Reports',
 shell('Reports','',
 '<div class="wf-row"><div class="wf-grow"><div class="wf-title">Reports</div><div class="wf-p">Cases by rating</div></div><div class="wf-btn" style="width:160px">Export CSV</div></div>'+
 '<div class="wf-row"><div class="wf-seg" style="width:360px"><span class="on">All</span><span>High</span><span>Medium</span><span>Low</span></div><div class="wf-input" style="width:200px">Status: any</div><div class="wf-input" style="width:200px">Created: last 90 days</div></div>'+
 '<div class="wf-tbl">'+rowCells('120px 1.4fr 100px 150px 150px 140px',['Case','Customer','Rating','Status','Next review','Created by']).replace('wf-tr','wf-tr h')+
 [1,2,3,4,5].map(function(){return rowCells('120px 1.4fr 100px 150px 150px 140px',['<b>KYC-1000x</b>','<div class="wf-line dark m"></div>','<span class="wf-chip">High</span>','<span class="wf-chip">Approved</span>','<span class="wf-p">Feb 2026</span>','<span class="wf-p">analyst1</span>'])}).join('')+'</div>'+
 '<div class="wf-box wf-fill wf-row"><span class="wf-icon"></span><span class="wf-p">ID numbers and dates of birth are masked in this view and in the export.</span></div>'+pin(1,1230,40)+pin(2,270,730)),
 ['Export is secondary. A single button, and it states what it will contain.','Masking is explained in place, not hidden. Only Compliance sees full values (NFR-1).'],
 'No results, exporting, export failed, Compliance view with unmasked toggle.'));

document.getElementById('board').innerHTML=out.join('<div class="wf-flow" style="font-size:12px;color:#80838c">&darr; next screen</div>');
</script>
</body></html>
